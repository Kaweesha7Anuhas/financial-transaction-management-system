spring.application.name=financial-transaction-system

# ---------- MySQL datasource ----------
spring.datasource.url=jdbc:mysql://localhost:3306/financial_transaction_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Anuhas1111
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
