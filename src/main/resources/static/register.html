<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FTM System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="container-fluid login-container p-0">
    <div class="row g-0 h-100">
        
        <!-- Left Side: Branding -->
        <div class="col-md-6 login-left d-none d-md-flex">
            <i class="bi bi-bank2 display-1 mb-4 text-primary"></i>
            <h1 class="display-5 fw-bold mb-3">Join FTM System</h1>
            <p class="lead text-light opacity-75">Create your account to manage your finances securely.</p>
        </div>

        <!-- Right Side: Register Form -->
        <div class="col-md-6 d-flex align-items-center justify-content-center bg-white py-5">
            <div class="card shadow-lg border-0 rounded-4" style="width: 100%; max-width: 500px;">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-dark">Create Account</h3>
                        <p class="text-muted">It only takes a minute</p>
                    </div>

                    <div id="registerError" class="alert alert-danger d-none" role="alert"></div>
                    <div id="registerSuccess" class="alert alert-success d-none" role="alert">Registration successful! Redirecting to login...</div>

                    <form id="registerForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">First Name</label>
                                <input type="text" class="form-control" id="firstName" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Last Name</label>
                                <input type="text" class="form-control" id="lastName" required>
                            </div>
                            
                            <div class="col-12">
                                <label class="form-label fw-semibold">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            
                            <div class="col-12">
                                <label class="form-label fw-semibold">Username</label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            
                            <div class="col-12">
                                <label class="form-label fw-semibold">Phone Number</label>
                                <input type="text" class="form-control" id="phoneNumber" required>
                            </div>
                            
                            <div class="col-12">
                                <label class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mt-4" id="registerBtn">
                            <span id="registerText">Register</span>
                            <span id="registerSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        </button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <small class="text-muted">Already have an account? <a href="/index.html" class="text-primary fw-bold text-decoration-none">Sign In</a></small>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/register.js"></script>
</body>
</html>
