<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts - FTM System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="brand"><i class="bi bi-bank2 text-primary me-2"></i> FTM System</div>
    <div class="nav flex-column mt-3">
        <a class="nav-item" href="/pages/admin/dashboard.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
        <a class="nav-item" href="/pages/admin/customers.html"><i class="bi bi-people"></i> Customers</a>
        <a class="nav-item active" href="/pages/admin/accounts.html"><i class="bi bi-credit-card"></i> Accounts</a>
        <a class="nav-item" href="/pages/admin/transactions.html"><i class="bi bi-arrow-left-right"></i> Process Tx</a>
        <a class="nav-item" href="/pages/admin/transaction-history.html"><i class="bi bi-clock-history"></i> Tx History</a>
        <a class="nav-item" href="/pages/admin/reports.html"><i class="bi bi-bar-chart"></i> Reports</a>
        <a class="nav-item" href="/pages/admin/users.html"><i class="bi bi-person-gear"></i> Staff Management</a>
        <a class="nav-item" href="/pages/admin/audit-logs.html"><i class="bi bi-shield-check"></i> Audit Logs</a>
        <a class="nav-item mt-5 text-danger" id="logoutBtn" style="cursor: pointer;"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>
</div>

<!-- Main Content -->
<div class="main-content">
    <div class="topbar">
        <h5 class="m-0 fw-bold text-dark">Account Management</h5>
        <div class="d-flex align-items-center gap-3">
            <span class="fw-semibold text-muted" id="adminName">Loading...</span>
            <div class="avatar bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 40px; height: 40px;">A</div>
        </div>
    </div>

    <div class="container-fluid p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="fw-bold m-0">All Bank Accounts</h5>
            <button class="btn btn-primary fw-bold" onclick="openCreateModal()">
                <i class="bi bi-plus-circle me-2"></i> Open New Account
            </button>
        </div>

        <div class="stat-card p-0 overflow-hidden">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr>
                        <th class="ps-4">Account Number</th>
                        <th>Customer</th>
                        <th>Type</th>
                        <th>Balance</th>
                        <th>Status</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                </thead>
                <tbody id="accountTableBody">
                    <tr><td colspan="6" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm me-2"></div> Loading accounts...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Create Account Modal -->
<div class="modal fade" id="accountModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-light border-0">
                <h5 class="modal-title fw-bold">Open New Account</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Select Customer</label>
                    <select class="form-select" id="customerSelect" required>
                        <option value="">Loading customers...</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Account Type</label>
                    <select class="form-select" id="accountType" required>
                        <option value="SAVINGS">SAVINGS</option>
                        <option value="CURRENT">CURRENT</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Account Name (Alias)</label>
                    <input type="text" class="form-control" id="accountName" placeholder="e.g., Primary Savings" required>
                </div>
            </div>
            <div class="modal-footer border-0 bg-light">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary fw-bold" id="saveBtn" onclick="saveAccount()">Create Account</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/accounts.js"></script>
</body>
</html>
