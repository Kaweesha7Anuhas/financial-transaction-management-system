<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - FTM System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="brand">
        <i class="bi bi-bank2 text-primary me-2"></i> FTM System
    </div>
    <div class="nav flex-column mt-3">
        <a class="nav-item active" href="/pages/admin/dashboard.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
        <a class="nav-item" href="/pages/admin/customers.html"><i class="bi bi-people"></i> Customers</a>
        <a class="nav-item" href="/pages/admin/accounts.html"><i class="bi bi-credit-card"></i> Accounts</a>
        <a class="nav-item" href="/pages/admin/transactions.html"><i class="bi bi-arrow-left-right"></i> Process Tx</a>
        <a class="nav-item" href="/pages/admin/transaction-history.html"><i class="bi bi-clock-history"></i> Tx History</a>
        <a class="nav-item" href="/pages/admin/reports.html"><i class="bi bi-bar-chart"></i> Reports</a>
        <a class="nav-item" href="/pages/admin/users.html"><i class="bi bi-person-gear"></i> Staff Management</a>
        <a class="nav-item" href="/pages/admin/audit-logs.html"><i class="bi bi-shield-check"></i> Audit Logs</a>
        <a class="nav-item mt-5 text-danger" id="logoutBtn" style="cursor: pointer;"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>
</div>

<!-- Main Content -->
<div class="main-content">
    <!-- Topbar -->
    <div class="topbar">
        <h5 class="m-0 fw-bold text-dark">Overview</h5>
        <div class="d-flex align-items-center gap-3">
            <span class="fw-semibold text-muted" id="adminName">Loading...</span>
            <div class="avatar bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 40px; height: 40px;">
                A
            </div>
        </div>
    </div>

    <!-- Dashboard Content -->
    <div class="container-fluid p-4">
        
        <!-- Stat Cards -->
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="stat-card d-flex align-items-center">
                    <div class="icon-box bg-primary bg-opacity-10 text-primary me-3"><i class="bi bi-people"></i></div>
                    <div>
                        <h6 class="text-muted mb-1">Total Customers</h6>
                        <h3 class="mb-0 fw-bold" id="totalCustomers">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card d-flex align-items-center">
                    <div class="icon-box bg-success bg-opacity-10 text-success me-3"><i class="bi bi-credit-card"></i></div>
                    <div>
                        <h6 class="text-muted mb-1">Total Accounts</h6>
                        <h3 class="mb-0 fw-bold" id="totalAccounts">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card d-flex align-items-center">
                    <div class="icon-box bg-info bg-opacity-10 text-info me-3"><i class="bi bi-arrow-down-circle"></i></div>
                    <div>
                        <h6 class="text-muted mb-1">Total Deposits</h6>
                        <h3 class="mb-0 fw-bold" id="totalDeposits">0.00</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card d-flex align-items-center">
                    <div class="icon-box bg-danger bg-opacity-10 text-danger me-3"><i class="bi bi-arrow-up-circle"></i></div>
                    <div>
                        <h6 class="text-muted mb-1">Total Withdrawals</h6>
                        <h3 class="mb-0 fw-bold" id="totalWithdrawals">0.00</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="row g-4">
            <!-- Chart -->
            <div class="col-md-8">
                <div class="stat-card h-100">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="fw-bold m-0">Transaction Volume</h5>
                        <select class="form-select w-auto" id="chartType">
                            <option value="daily">Daily (Past 7 days)</option>
                            <option value="monthly">Monthly</option>
                        </select>
                    </div>
                    <!-- FIXED CHART CONTAINER -->
                    <div style="position: relative; height: 320px; width: 100%;">
                        <canvas id="transactionChart"></canvas>
                    </div>
                </div>
            </div>
            
            <!-- Cashier Performance -->
            <div class="col-md-4">
                <div class="stat-card h-100">
                    <h5 class="fw-bold mb-4">Cashier Performance</h5>
                    <div class="list-group list-group-flush" id="cashierPerformanceList">
                        <!-- Data injected via JS -->
                        <div class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm me-2"></div> Loading...</div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/app.js"></script>
<script src="/js/admin-dashboard.js"></script>
</body>
</html>
