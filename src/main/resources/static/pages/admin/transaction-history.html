<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Transactions - FTM System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="brand"><i class="bi bi-bank2 text-primary me-2"></i> FTM System</div>
    <div class="nav flex-column mt-3">
        <a class="nav-item" href="/pages/admin/dashboard.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
        <a class="nav-item" href="/pages/admin/customers.html"><i class="bi bi-people"></i> Customers</a>
        <a class="nav-item" href="/pages/admin/accounts.html"><i class="bi bi-credit-card"></i> Accounts</a>
        <a class="nav-item" href="/pages/admin/transactions.html"><i class="bi bi-arrow-left-right"></i> Process Tx</a>
        <a class="nav-item active" href="/pages/admin/transaction-history.html"><i class="bi bi-clock-history"></i> Tx History</a>
        <a class="nav-item" href="/pages/admin/reports.html"><i class="bi bi-bar-chart"></i> Reports</a>
        <a class="nav-item" href="/pages/admin/users.html"><i class="bi bi-person-gear"></i> Staff Management</a>
        <a class="nav-item" href="/pages/admin/audit-logs.html"><i class="bi bi-shield-check"></i> Audit Logs</a>
        <a class="nav-item mt-5 text-danger" id="logoutBtn" style="cursor: pointer;"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>
</div>

<!-- Main Content -->
<div class="main-content">
    <div class="topbar">
        <h5 class="m-0 fw-bold text-dark">Global Transaction History</h5>
        <div class="d-flex align-items-center gap-3">
            <span class="fw-semibold text-muted" id="adminName">Loading...</span>
            <div class="avatar bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 40px; height: 40px;">A</div>
        </div>
    </div>

    <div class="container-fluid p-4">
        
        <!-- Filters -->
        <div class="stat-card mb-4 p-3">
            <div class="row g-2 align-items-end">
                <div class="col-md-2">
                    <label class="form-label fw-semibold small mb-1">Account No</label>
                    <input type="text" class="form-control form-control-sm" id="filterAccount" placeholder="Search...">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold small mb-1">Type</label>
                    <select class="form-select form-select-sm" id="filterType">
                        <option value="">All</option>
                        <option value="DEPOSIT">Deposit</option>
                        <option value="WITHDRAWAL">Withdrawal</option>
                        <option value="REVERSAL">Reversal</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold small mb-1">Status</label>
                    <select class="form-select form-select-sm" id="filterStatus">
                        <option value="">All</option>
                        <option value="COMPLETED">Completed</option>
                        <option value="REVERSED">Reversed</option>
                        <option value="FAILED">Failed</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold small mb-1">Cashier</label>
                    <input type="text" class="form-control form-control-sm" id="filterCashier" placeholder="Username...">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold small mb-1">Date Range</label>
                    <div class="input-group input-group-sm">
                        <input type="date" class="form-control" id="filterStartDate">
                        <span class="input-group-text bg-light">to</span>
                        <input type="date" class="form-control" id="filterEndDate">
                    </div>
                </div>
                <div class="col-md-1 text-end">
                    <button class="btn btn-primary btn-sm w-100 fw-bold" onclick="applyFilters()">Filter</button>
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="stat-card p-0 overflow-hidden">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr>
                        <th class="ps-4">Date & Time</th>
                        <th>Ref</th>
                        <th>Account</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Cashier</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                    <tr><td colspan="7" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm me-2"></div> Loading...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="d-flex justify-content-between align-items-center mt-3">
            <span class="text-muted small" id="pageInfo">Page 0 of 0</span>
            <div>
                <button class="btn btn-outline-secondary btn-sm" id="prevBtn" onclick="changePage(-1)" disabled>Previous</button>
                <button class="btn btn-outline-secondary btn-sm" id="nextBtn" onclick="changePage(1)" disabled>Next</button>
            </div>
        </div>

    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/transaction-history.js"></script>
</body>
</html>
