<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - FTM System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="brand"><i class="bi bi-bank2 text-primary me-2"></i> FTM System</div>
    <div class="nav flex-column mt-3">
        <a class="nav-item" href="/pages/admin/dashboard.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
        <a class="nav-item active" href="/pages/admin/customers.html"><i class="bi bi-people"></i> Customers</a>
        <a class="nav-item" href="/pages/admin/accounts.html"><i class="bi bi-credit-card"></i> Accounts</a>
        <a class="nav-item" href="/pages/admin/transactions.html"><i class="bi bi-arrow-left-right"></i> Process Tx</a>
        <a class="nav-item" href="/pages/admin/transaction-history.html"><i class="bi bi-clock-history"></i> Tx History</a>
        <a class="nav-item" href="/pages/admin/reports.html"><i class="bi bi-bar-chart"></i> Reports</a>
        <a class="nav-item" href="/pages/admin/users.html"><i class="bi bi-person-gear"></i> Staff Management</a>
        <a class="nav-item" href="/pages/admin/audit-logs.html"><i class="bi bi-shield-check"></i> Audit Logs</a>
        <a class="nav-item mt-5 text-danger" id="logoutBtn" style="cursor: pointer;"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>
</div>

<!-- Main Content -->
<div class="main-content">
    <div class="topbar">
        <h5 class="m-0 fw-bold text-dark">Customer Management</h5>
        <div class="d-flex align-items-center gap-3">
            <span class="fw-semibold text-muted" id="adminName">Loading...</span>
            <div class="avatar bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 40px; height: 40px;">A</div>
        </div>
    </div>

    <div class="container-fluid p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="fw-bold m-0">All Customers</h5>
            <button class="btn btn-primary fw-bold" onclick="openCreateModal()">
                <i class="bi bi-person-plus me-2"></i> New Customer
            </button>
        </div>

        <div class="stat-card mb-4 p-3">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                <input type="text" class="form-control border-start-0" id="searchInput" placeholder="Search by name or email...">
                <button class="btn btn-outline-secondary" type="button" onclick="loadCustomers()">Search</button>
            </div>
        </div>

        <div class="stat-card p-0 overflow-hidden">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr>
                        <th class="ps-4">Code</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Status</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                </thead>
                <tbody id="customerTableBody">
                    <tr><td colspan="6" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm me-2"></div> Loading customers...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Create/Edit Customer Modal -->
<div class="modal fade" id="customerModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-light border-0">
                <h5 class="modal-title fw-bold" id="modalTitle">New Customer</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <input type="hidden" id="customerId">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">First Name</label>
                        <input type="text" class="form-control" id="firstName" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Last Name</label>
                        <input type="text" class="form-control" id="lastName" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Phone</label>
                        <input type="text" class="form-control" id="phoneNumber">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">City</label>
                        <input type="text" class="form-control" id="city">
                    </div>
                </div>
            </div>
            <div class="modal-footer border-0 bg-light">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary fw-bold" id="saveBtn" onclick="saveCustomer()">Save Customer</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/customers.js"></script>
</body>
</html>
