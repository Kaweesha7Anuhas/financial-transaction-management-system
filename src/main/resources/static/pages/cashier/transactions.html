<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Transactions - FTM System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="brand"><i class="bi bi-bank2 text-primary me-2"></i> FTM System</div>
    <div class="nav flex-column mt-3">
        <a class="nav-item" href="/pages/cashier/dashboard.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
        <a class="nav-item active" href="/pages/cashier/transactions.html"><i class="bi bi-arrow-left-right"></i> Process Tx</a>
        <a class="nav-item" href="/pages/cashier/transaction-history.html"><i class="bi bi-clock-history"></i> Tx History</a>
        <a class="nav-item mt-5 text-danger" id="logoutBtn" style="cursor: pointer;"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>
</div>

<!-- Main Content -->
<div class="main-content">
    <div class="topbar">
        <h5 class="m-0 fw-bold text-dark">Transaction Processing</h5>
        <div class="d-flex align-items-center gap-3">
            <span class="fw-semibold text-muted" id="adminName">Loading...</span>
            <div class="avatar bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 40px; height: 40px;">C</div>
        </div>
    </div>

    <div class="container-fluid p-4">
        <div class="row g-4">
            <!-- Left Column: Search & Action Form -->
            <div class="col-md-5">
                <div class="stat-card mb-4">
                    <h5 class="fw-bold mb-3">Find Account</h5>
                    <div class="input-group">
                        <input type="text" class="form-control" id="searchAccountInput" placeholder="Enter 10-digit Account Number">
                        <button class="btn btn-primary fw-bold" onclick="searchAccount()"><i class="bi bi-search"></i> Search</button>
                    </div>
                    <div id="searchError" class="text-danger small mt-2 d-none"></div>
                </div>

                <div class="stat-card d-none" id="actionCard">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <h6 class="text-muted mb-1">Account Holder</h6>
                            <h5 class="fw-bold mb-0" id="accCustomerName">-</h5>
                        </div>
                        <div class="text-end">
                            <h6 class="text-muted mb-1">Current Balance</h6>
                            <h4 class="fw-bold text-success mb-0" id="accBalance">LKR 0.00</h4>
                        </div>
                    </div>
                    <hr>
                    
                    <ul class="nav nav-pills nav-fill mb-3" id="pills-tab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active fw-bold text-success" id="pills-deposit-tab" data-bs-toggle="pill" data-bs-target="#pills-deposit" type="button" role="tab">Deposit</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link fw-bold text-danger" id="pills-withdraw-tab" data-bs-toggle="pill" data-bs-target="#pills-withdraw" type="button" role="tab">Withdraw</button>
                        </li>
                    </ul>

                    <div class="tab-content" id="pills-tabContent">
                        <!-- Deposit Form -->
                        <div class="tab-pane fade show active" id="pills-deposit" role="tabpanel">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Amount (LKR)</label>
                                <input type="number" class="form-control form-control-lg" id="depositAmount" min="1" step="0.01" placeholder="0.00">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Payment Method</label>
                                <select class="form-select" id="depositMethod">
                                    <option value="CASH">CASH</option>
                                    <option value="BANK_TRANSFER">BANK TRANSFER</option>
                                    <option value="CHEQUE">CHEQUE</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Description</label>
                                <input type="text" class="form-control" id="depositDesc" placeholder="Optional notes...">
                            </div>
                            <button class="btn btn-success w-100 fw-bold py-2" id="btnDeposit" onclick="processTransaction('DEPOSIT')">Process Deposit</button>
                        </div>

                        <!-- Withdraw Form -->
                        <div class="tab-pane fade" id="pills-withdraw" role="tabpanel">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Amount (LKR)</label>
                                <input type="number" class="form-control form-control-lg" id="withdrawAmount" min="1" step="0.01" placeholder="0.00">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Payment Method</label>
                                <select class="form-select" id="withdrawMethod">
                                    <option value="CASH">CASH</option>
                                    <option value="BANK_TRANSFER">BANK TRANSFER</option>
                                    <option value="CHEQUE">CHEQUE</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Description</label>
                                <input type="text" class="form-control" id="withdrawDesc" placeholder="Optional notes...">
                            </div>
                            <button class="btn btn-danger w-100 fw-bold py-2" id="btnWithdraw" onclick="processTransaction('WITHDRAWAL')">Process Withdrawal</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Recent Transactions -->
            <div class="col-md-7">
                <div class="stat-card h-100">
                    <h5 class="fw-bold mb-4">Recent Transactions</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Date</th>
                                    <th>Reference</th>
                                    <th>Type</th>
                                    <th>Amount</th>
                                    <th>Balance</th>
                                </tr>
                            </thead>
                            <tbody id="historyTableBody">
                                <tr><td colspan="5" class="text-center text-muted py-5">Search an account to view transaction history.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/transactions.js"></script> <!-- REUSING SAME JS -->
</body>
</html>
