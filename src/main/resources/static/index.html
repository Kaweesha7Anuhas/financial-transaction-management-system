<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FTM System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="container-fluid login-container p-0">
    <div class="row g-0 h-100">
        
        <!-- Left Side: Branding -->
        <div class="col-md-6 login-left d-none d-md-flex">
            <i class="bi bi-bank2 display-1 mb-4 text-primary"></i>
            <h1 class="display-5 fw-bold mb-3">FTM System</h1>
            <p class="lead text-light opacity-75">Financial Transaction Management</p>
            <div class="mt-5 text-start">
                <p><i class="bi bi-check-circle-fill text-success me-2"></i> Secure Banking Operations</p>
                <p><i class="bi bi-check-circle-fill text-success me-2"></i> Real-time Transaction Processing</p>
                <p><i class="bi bi-check-circle-fill text-success me-2"></i> Enterprise-grade Security</p>
            </div>
        </div>

        <!-- Right Side: Login Form -->
        <div class="col-md-6 d-flex align-items-center justify-content-center bg-white">
            <div class="card shadow-lg border-0 rounded-4" style="width: 100%; max-width: 420px;">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-dark">Welcome Back</h3>
                        <p class="text-muted">Please sign in to your account</p>
                    </div>

                    <div id="loginError" class="alert alert-danger d-none" role="alert"></div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                                <input type="text" class="form-control border-start-0 bg-light" id="username" required placeholder="Enter username">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" class="form-control border-start-0 bg-light" id="password" required placeholder="Enter password">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="loginBtn">
                            <span id="loginText">Sign In</span>
                            <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        </button>
                    </form>
                    
                    <!-- NEW: Register Link -->
                    <div class="text-center mt-3">
                        <small class="text-muted">Don't have an account? <a href="/register.html" class="text-primary fw-bold text-decoration-none">Register Here</a></small>
                    </div>

                    <div class="text-center mt-4">
                        <small class="text-muted">&copy; 2026 FTM System. All rights reserved.</small>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
